name: Verificar trilhas licenciadas do Teste 72

on:
  push:
    paths:
      - 'scripts/build_soundtrack72.py'
      - '.github/workflows/test-soundtrack72.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor de áudio
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Verificar licenças e downloads
        run: |
          python3 scripts/build_soundtrack72.py /tmp/soundtrack72
          cat /tmp/soundtrack72/manifest.txt
          ls -lh /tmp/soundtrack72
