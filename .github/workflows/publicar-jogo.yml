name: Publicar No Limiar do Finito

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'scripts/patch_teste60.py'
      - 'scripts/patch_teste62.py'
      - 'scripts/patch_teste63.py'
      - 'scripts/patch_teste64.py'
      - 'scripts/patch_teste65.py'
      - 'scripts/finale-teste66.js'
      - 'scripts/soundtrack-teste72.js'
      - 'scripts/build_soundtrack72.py'
      - 'scripts/priante_atlas73.b64'
      - 'scripts/priante-teste73.js'
      - 'scripts/priante-teste76.js'
      - 'scripts/patch_teste73.py'
      - 'scripts/make_cantiga_test67.py'
      - '.github/workflows/publicar-jogo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Buscar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar ultima versao do jogo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          python3 - <<'PY'
          import pathlib, re, zipfile, sys
          zips = sorted(pathlib.Path('.').glob('No_Limiar_do_Finito_GitHub_Pages_Teste_*.zip'))
          if not zips:
              raise SystemExit('Nenhum pacote de jogo foi encontrado.')
          def version(path):
              m = re.search(r'Teste_(\d+)\.zip$', path.name)
              return int(m.group(1)) if m else -1
          chosen = max(zips, key=version)
          print(f'Publicando {chosen.name}')
          with zipfile.ZipFile(chosen) as archive:
              if 'index.html' not in archive.namelist():
                  raise SystemExit('O pacote precisa conter um index.html.')
              for filename in ('index.html', '.nojekyll'):
                  if filename in archive.namelist():
                      pathlib.Path('site', filename).write_bytes(archive.read(filename))
          index = pathlib.Path('site/index.html')
          if not index.is_file() or index.stat().st_size < 100:
              raise SystemExit('index.html ausente ou vazio.')
          pathlib.Path('site/.nojekyll').touch()
          print(f'index.html pronto: {index.stat().st_size} bytes')
          PY

      - name: Aplicar aprimoramentos do Teste 60
        run: python3 scripts/patch_teste60.py site/index.html

      - name: Montar arquivo integral do Teste 61 revisado
        shell: bash
        run: |
          set -euo pipefail
          cat site_parts/part_*.txt > site/index.html
          test "$(wc -c < site/index.html)" -eq 8329781
          grep -q "SCENE3_OBSERVE_TEXT" site/index.html
          grep -q "Teste 61" site/index.html
          echo "Teste 61 integral pronto para publicacao: $(wc -c < site/index.html) bytes"

      - name: Aplicar colisões reais nos tokens dos quatro anjos - Teste 62
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_teste62.py site/index.html
          grep -q 'Teste 62' site/index.html
          grep -q "const wingHalf=a.id==='samuel'?40:43" site/index.html

      - name: Habilitar interações de Lumini por memória - Teste 63
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_teste63.py
          python3 scripts/patch_teste63.py site/index.html
          grep -q "Versão 63" site/index.html
          grep -q "luminiUnansweredMemories" site/index.html
          grep -q "luminiMemoryVisited.add" site/index.html

      - name: Atualizar fala da Omega - Teste 64
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_teste64.py
          python3 scripts/patch_teste64.py site/index.html
          grep -q "O tempo leva tudo. Até mesmo aquilo que acreditávamos ser eterno." site/index.html
          grep -q "Versão 64" site/index.html

      - name: Mostrar nomes apenas apos Lumini revelar cada memoria - Teste 65
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_teste65.py
          python3 scripts/patch_teste65.py site/index.html
          grep -q "Versão 65" site/index.html
          grep -q "function scene1DisplayName" site/index.html
          grep -q "function scene2DisplayName(id)" site/index.html
          grep -q "function scene3DisplayName(id)" site/index.html

      - name: Acrescentar corredor e perseguicao final - Teste 66
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/finale-teste66.js site/finale-teste66.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          if html.count('Versão 65 ·') != 1 or html.count('</body>') != 1:
              raise SystemExit('Marcadores da versão anterior ausentes. Publicação interrompida.')
          html=html.replace('Versão 65 ·','Versão 66 ·',1)
          html=html.replace('PRÓLOGO · TESTE 62 ·','PRÓLOGO · TESTE 66 ·')
          html=html.replace('<title>No Limiar do Finito — Teste 62', '<title>No Limiar do Finito — Teste 66',1)
          html=html.replace('</body>','<script src="finale-teste66.js"></script>\n</body>',1)
          p.write_text(html,encoding='utf-8')
          assert 'finale-teste66.js' in html
          assert Path('site/finale-teste66.js').stat().st_size>20000
          print('Teste 66 - corredor, cantiga, perseguicao e captura prontos.')
          PY

      - name: Produzir cantiga cantada e publicar encerramento - Teste 67
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v espeak >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends espeak ffmpeg
          fi
          python3 scripts/make_cantiga_test67.py site/cantiga-67.ogg
          test "$(wc -c < site/cantiga-67.ogg)" -gt 10000
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          assert html.count('Versão 66 ·')==1, 'Versão anterior não localizada'
          html=html.replace('Versão 66 ·','Versão 67 ·',1)
          html=html.replace('PRÓLOGO · TESTE 66 ·','PRÓLOGO · TESTE 67 ·')
          html=html.replace('<title>No Limiar do Finito — Teste 66','<title>No Limiar do Finito — Teste 67')
          p.write_text(html,encoding='utf-8')
          js=Path('site/finale-teste66.js').read_text(encoding='utf-8')
          assert 'final-credits-screen' in js and 'hush-human68.ogg' in js
          assert 'data:image/png;base64,' in js
          print('Teste 67: corredor, cantiga original com voz, captura e créditos prontos')
          PY

      - name: Incorporar cantiga humana e encontro final - Teste 68
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 35 \
            --user-agent 'Mozilla/5.0 (No Limiar do Finito)' \
            -o site/lullaby-human68-source.mp3 \
            'https://cdn.freesound.org/previews/511/511086_10086928-hq.mp3'
          test "$(wc -c < site/lullaby-human68-source.mp3)" -gt 20000
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 site/lullaby-human68-source.mp3
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -i site/lullaby-human68-source.mp3 \
            -af "asetrate=44100*0.78,aresample=44100,aecho=0.7:0.5:220:0.22,lowpass=f=1700,volume=1.18" \
            -c:a libvorbis -q:a 5 site/hush-human68.ogg
          test "$(wc -c < site/hush-human68.ogg)" -gt 12000
          rm site/lullaby-human68-source.mp3
          node --check site/finale-teste66.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('Versão 67 ·')==1
          s=s.replace('Versão 67 ·','Versão 68 ·',1)
          s=s.replace('PRÓLOGO · TESTE 67 ·','PRÓLOGO · TESTE 68 ·')
          s=s.replace('<title>No Limiar do Finito — Teste 67','<title>No Limiar do Finito — Teste 68')
          p.write_text(s,encoding='utf-8')
          js=Path('site/finale-teste66.js').read_text(encoding='utf-8')
          assert 'hush-human68.ogg' in js
          assert 'Você não deveria estar aqui.' in js
          assert 'Ainda não é hora de acordar.' in js
          assert '__finaleTest68' in js
          print('Teste 68: audio humano CC0, corredor longo, confronto, captura e creditos verificados')
          PY

      - name: Publicar dialogo final classico e tela preta - Teste 69
        shell: bash
        run: |
          set -euo pipefail
          node --check site/finale-teste66.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('Versão 68 ·')==1, 'Versao 68 ausente'
          s=s.replace('Versão 68 ·','Versão 69 ·',1)
          s=s.replace('PRÓLOGO · TESTE 68 ·','PRÓLOGO · TESTE 69 ·')
          s=s.replace('<title>No Limiar do Finito — Teste 68','<title>No Limiar do Finito — Teste 69')
          p.write_text(s,encoding='utf-8')
          js=Path('site/finale-teste66.js').read_text(encoding='utf-8')
          assert "showDialogue('???',['Você não deveria estar aqui.'],'lantern_man'" in js
          assert 'speechSynthesis' not in js, 'Fala sintetizada indevida'
          assert 'Ainda não é hora de acordar.' in js
          assert 'size=400+t*500' not in js, 'Zoom indevido'
          assert "if(player.y<5600)" in js, 'Cantiga precisa iniciar mais cedo'
          assert "FINALE.endingAt=gameTime;FINALE.creditsReached=false;setState('final-end');" in js
          assert '__finaleTest69' in js
          print('Teste 69 confirmado: fala por texto, cancao prolongada, tela preta e creditos')
          PY

      - name: Retirar aviso persistente da porta - Teste 70
        shell: bash
        run: |
          set -euo pipefail
          node --check site/finale-teste66.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          old="toast('O ferro cede. Agora é possível atravessar a porta.',3.5);"
          if s.count(old)!=1:
              raise SystemExit(f'Aviso da porta encontrado {s.count(old)} vezes; esperado 1.')
          s=s.replace(old,'',1)
          assert s.count('Versão 69 ·')==1, 'Versao anterior ausente'
          s=s.replace('Versão 69 ·','Versão 70 ·',1)
          s=s.replace('PRÓLOGO · TESTE 69 ·','PRÓLOGO · TESTE 70 ·')
          s=s.replace('<title>No Limiar do Finito — Teste 69','<title>No Limiar do Finito — Teste 70')
          p.write_text(s,encoding='utf-8')
          j=Path('site/finale-teste66.js').read_text(encoding='utf-8')
          assert "toastExpire=0" in j
          assert "$('toast').classList.add('hidden')" in j
          assert '/* Teste 71' in j or '/* Teste 70' in j
          print('Teste 70: aviso da porta removido e HUD do corredor limpo.')
          PY

      - name: Publicar audio mais intenso no epilogo - Teste 71
        shell: bash
        run: |
          set -euo pipefail
          node --check site/finale-teste66.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          assert s.count('Versão 70 ·')==1, 'Versão 70 ausente'
          s=s.replace('Versão 70 ·','Versão 71 ·',1)
          s=s.replace('PRÓLOGO · TESTE 70 ·','PRÓLOGO · TESTE 71 ·')
          s=s.replace('<title>No Limiar do Finito — Teste 70','<title>No Limiar do Finito — Teste 71')
          p.write_text(s,encoding='utf-8')
          js=Path('site/finale-teste66.js').read_text(encoding='utf-8')
          assert '/* Teste 71' in js
          assert 'function chaseMusicBeat()' in js
          assert "voice.volume=clamp(.43+.55" in js
          assert "chaseCompressor.ratio.value=11" in js
          assert 'stopChaseSound();' in js
          assert '__finaleTest71' in js
          print('Teste 71: cantiga mais alta, fuga musical em 168 BPM e pico sonoro controlado.')
          PY

      - name: Integrar trilha licenciada aos nove momentos - Teste 72
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/soundtrack-teste72.js site/soundtrack-teste72.js
          python3 scripts/build_soundtrack72.py site/soundtrack72
          node --check site/soundtrack-teste72.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          base=Path('site')
          m=json.loads((base/'soundtrack72/manifest.json').read_text(encoding='utf-8'))
          keys=['menu','limiante','priantes','ceu','cena','biblioteca','lumini','perseguicao','creditos']
          missing=[k for k in keys if k not in m['available'] or not (base/'soundtrack72'/f'{k}.ogg').exists()]
          if missing:raise SystemExit('Trilhas ausentes: '+', '.join(missing))
          p=base/'index.html'
          html=p.read_text(encoding='utf-8')
          if html.count('Versão 71 ·')!=1:
            raise SystemExit('A versão anterior não está no HTML.')
          if html.count('<script src="finale-teste66.js"></script>')!=1:
            raise SystemExit('Marcador da cena final ausente.')
          html=html.replace('Versão 71 ·','Versão 72 ·',1)
          html=html.replace('PRÓLOGO · TESTE 71 ·','PRÓLOGO · TESTE 72 ·')
          html=html.replace('<title>No Limiar do Finito — Teste 71','<title>No Limiar do Finito — Teste 72')
          html=html.replace('<script src="finale-teste66.js"></script>',
                            '<script src="finale-teste66.js"></script>\n<script src="soundtrack-teste72.js"></script>',1)
          p.write_text(html,encoding='utf-8')
          print('TESTE 72 OK: '+', '.join(m['available']))
          print('Proteção de direitos: Spare Hearts não é incorporada sem licença.')
          PY

      - name: Integrar os novos Priantes e recuperar as falas - Teste 73
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          base64 --decode scripts/priante_atlas73.b64 > site/priante73.webp
          test "$(wc -c < site/priante73.webp)" -ge 3000
          python3 - <<'PY'
          from pathlib import Path
          f=Path('site/priante73.webp').read_bytes()
          assert f[:4]==b'RIFF' and f[8:12]==b'WEBP', 'Atlas inválido'
          print('Atlas WEBP verificado: '+str(len(f))+' bytes')
          PY
          cp scripts/priante-teste73.js site/priante-teste73.js
          node --check site/priante-teste73.js
          python3 -m py_compile scripts/patch_teste73.py
          python3 scripts/patch_teste73.py site/index.html
          grep -q "Versão 73" site/index.html
          grep -q "priante-teste73.js" site/index.html
          grep -q "SCENE2_CAST\[id\]?.lines" site/index.html
          echo "Teste 73: Priantes animados e falas da Cena Incompleta preservadas."

      - name: Corrigir olhos e orientar a animacao dos Priantes - Teste 76
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/priante-teste76.js site/priante-teste76.js
          node --check site/priante-teste76.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          assert html.count('Versão 73 ·')==1, 'Base publicada precisa ser o Teste 73'
          marker='<script src="priante-teste73.js"></script>'
          assert html.count(marker)==1, 'Novo controlador precisa carregar apos o atlas animado'
          html=html.replace(marker,marker+'\n<script src="priante-teste76.js"></script>',1)
          html=html.replace('Versão 73 ·','Versão 76 ·',1)
          html=html.replace('PRÓLOGO · TESTE 73 ·','PRÓLOGO · TESTE 76 ·')
          html=html.replace('<title>No Limiar do Finito — Teste 73','<title>No Limiar do Finito — Teste 76')
          p.write_text(html,encoding='utf-8')
          js=Path('site/priante-teste76.js').read_text(encoding='utf-8')
          for token in ['eyesByFrame','shortestAngle','microChases','canPrianteReach','originalUpdate(dt)','walkFrames','glowOnEye=function','__prianteTest76']:
            assert token in js, 'Falta elemento do ajuste: '+token
          assert (Path('site/priante73.webp').stat().st_size>3000)
          print('Teste 76 OK: olhos por quadro, rotacao em quatro direcoes e investida curta com recuo.')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar jogo para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
