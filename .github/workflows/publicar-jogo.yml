name: Publicar No Limiar do Finito

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'scripts/patch_teste60.py'
      - 'scripts/patch_teste62.py'
      - 'scripts/patch_teste63.py'
      - 'scripts/patch_teste64.py'
      - 'scripts/patch_teste65.py'
      - 'scripts/finale-teste66.js'
      - 'scripts/make_cantiga_test67.py'
      - '.github/workflows/publicar-jogo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Buscar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar ultima versao do jogo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          python3 - <<'PY'
          import pathlib, re, zipfile, sys
          zips = sorted(pathlib.Path('.').glob('No_Limiar_do_Finito_GitHub_Pages_Teste_*.zip'))
          if not zips:
              raise SystemExit('Nenhum pacote de jogo foi encontrado.')
          def version(path):
              m = re.search(r'Teste_(\d+)\.zip$', path.name)
              return int(m.group(1)) if m else -1
          chosen = max(zips, key=version)
          print(f'Publicando {chosen.name}')
          with zipfile.ZipFile(chosen) as archive:
              if 'index.html' not in archive.namelist():
                  raise SystemExit('O pacote precisa conter um index.html.')
              for filename in ('index.html', '.nojekyll'):
                  if filename in archive.namelist():
                      pathlib.Path('site', filename).write_bytes(archive.read(filename))
          index = pathlib.Path('site/index.html')
          if not index.is_file() or index.stat().st_size < 100:
              raise SystemExit('index.html ausente ou vazio.')
          pathlib.Path('site/.nojekyll').touch()
          print(f'index.html pronto: {index.stat().st_size} bytes')
          PY

      - name: Aplicar aprimoramentos do Teste 60
        run: python3 scripts/patch_teste60.py site/index.html

      - name: Montar arquivo integral do Teste 61 revisado
        shell: bash
        run: |
          set -euo pipefail
          cat site_parts/part_*.txt > site/index.html
          test "$(wc -c < site/index.html)" -eq 8329781
          grep -q "SCENE3_OBSERVE_TEXT" site/index.html
          grep -q "Teste 61" site/index.html
          echo "Teste 61 integral pronto para publicacao: $(wc -c < site/index.html) bytes"

      - name: Aplicar colisões reais nos tokens dos quatro anjos - Teste 62
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch_teste62.py site/index.html
          grep -q 'Teste 62' site/index.html
          grep -q "const wingHalf=a.id==='samuel'?40:43" site/index.html

      - name: Habilitar interações de Lumini por memória - Teste 63
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_teste63.py
          python3 scripts/patch_teste63.py site/index.html
          grep -q "Versão 63" site/index.html
          grep -q "luminiUnansweredMemories" site/index.html
          grep -q "luminiMemoryVisited.add" site/index.html

      - name: Atualizar fala da Omega - Teste 64
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_teste64.py
          python3 scripts/patch_teste64.py site/index.html
          grep -q "O tempo leva tudo. Até mesmo aquilo que acreditávamos ser eterno." site/index.html
          grep -q "Versão 64" site/index.html

      - name: Mostrar nomes apenas apos Lumini revelar cada memoria - Teste 65
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/patch_teste65.py
          python3 scripts/patch_teste65.py site/index.html
          grep -q "Versão 65" site/index.html
          grep -q "function scene1DisplayName" site/index.html
          grep -q "function scene2DisplayName(id)" site/index.html
          grep -q "function scene3DisplayName(id)" site/index.html

      - name: Acrescentar corredor e perseguicao final - Teste 66
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/finale-teste66.js site/finale-teste66.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          if html.count('Versão 65 ·') != 1 or html.count('</body>') != 1:
              raise SystemExit('Marcadores da versão anterior ausentes. Publicação interrompida.')
          html=html.replace('Versão 65 ·','Versão 66 ·',1)
          html=html.replace('PRÓLOGO · TESTE 62 ·','PRÓLOGO · TESTE 66 ·')
          html=html.replace('<title>No Limiar do Finito — Teste 62', '<title>No Limiar do Finito — Teste 66',1)
          html=html.replace('</body>','<script src="finale-teste66.js"></script>\n</body>',1)
          p.write_text(html,encoding='utf-8')
          assert 'finale-teste66.js' in html
          assert Path('site/finale-teste66.js').stat().st_size>20000
          print('Teste 66 - corredor, cantiga, perseguicao e captura prontos.')
          PY

      - name: Produzir cantiga cantada e publicar encerramento - Teste 67
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v espeak >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends espeak ffmpeg
          fi
          python3 scripts/make_cantiga_test67.py site/cantiga-67.ogg
          test "$(wc -c < site/cantiga-67.ogg)" -gt 10000
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          html=p.read_text(encoding='utf-8')
          assert html.count('Versão 66 ·')==1, 'Versão anterior não localizada'
          html=html.replace('Versão 66 ·','Versão 67 ·',1)
          html=html.replace('PRÓLOGO · TESTE 66 ·','PRÓLOGO · TESTE 67 ·')
          html=html.replace('<title>No Limiar do Finito — Teste 66','<title>No Limiar do Finito — Teste 67')
          p.write_text(html,encoding='utf-8')
          js=Path('site/finale-teste66.js').read_text(encoding='utf-8')
          assert 'final-credits-screen' in js and 'cantiga-67.ogg' in js
          assert 'data:image/png;base64,' in js
          print('Teste 67: corredor, cantiga original com voz, captura e créditos prontos')
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar jogo para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
